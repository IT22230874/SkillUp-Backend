name: Deploy Node Application

on: 
  push:
    branches:
      - skillup-ec2-docker-ssl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}     
      - name: Build Docker Image
        run: docker build -t savinduc/skillup-backend  .
      - name: Publish Image to docker hub
        run: docker push savinduc/skillup-backend:latest 
 
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Pull image from docker hub
        run: docker pull savinduc/skillup-backend:latest
      - name: Delete old container
        run: docker rm -f nodejs-app-container  
      - name: Run Docker Container
        run: |
         docker run -d -p 5000:5000 \
         --name nodejs-app-container \
         -e OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
         -e PORT='${{ secrets.PORT }}' \
         -e MONGO_URI='${{ secrets.MONGO_URI }}' \
         -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
         -e GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
         -e GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
         -e FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
         -e CLOUDINARY_CLOUD_NAME='${{ secrets.CLOUDINARY_CLOUD_NAME }}' \
         -e CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}' \
         -e CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}' \
         savinduc/skillup-backend

